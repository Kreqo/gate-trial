# Repository and CI (CI): the rules of this area. Source of truth;
# `cargo xtask rules generate` writes the views from these files.

[[rule]]
id = "CI-01"
level = "MUST"
statement = "The default branch is protected: no direct pushes, changes land through pull requests, and force-pushing to or deleting protected branches and release tags is blocked. History is rewritten only through a documented expunging process; each use is a class-3 decision, and once there are two maintainers, both approve it. New collaborators start with read access."
rationale = "Signatures, provenance and the review record all rest on a history nobody can rewrite."
verification = "Settings audit: branch and tag protection; default collaborator role"
check = "Settings"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-02"
level = "MUST"
statement = "Every pull request passes all required checks before merge, and a missing check counts as a failed one. Every project's required checks include format, lint, tests, docs, cargo-deny and the AI review (CI-03). Crates whose `publish` isn't `false` add semver (REL-02), coverage (QA-07), mutation testing of the diff (QA-08), replay of each fuzz target's corpus, the MSRV build (REL-04) and the feature powerset (CI-17); `xtask` adds mutation testing of the diff (QA-08)."
rationale = "Required checks make the rules in this document enforced rather than remembered. Published crates get the strictest checks because others depend on them, and `xtask` because it enforces every rule (DR-0001 row 9, DR-0002)."
verification = "Settings audit: required checks list; CI: an aggregate job fails when a required job is missing or failed"
check = "Settings"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-03"
level = "MUST"
statement = "Every change is reviewed before it merges by a reviewer other than its author: the independent AI review, a reviewer agent that runs in its own job with a fresh context and no write access to the code, never sees the session that wrote the change, and checks it against the written review rubric. Its verdict is a required check (CI-02), and an unreadable verdict fails it. The founder's hand-written changes get the same AI review. Gated changes also follow CI-15."
rationale = "A second look catches what the author can't see; with one maintainer, an independent AI review is the second look available, and per-change human review was not adopted (DR-0001 row 4)."
verification = "CI: the AI review's verdict is a required check, and a missing or unreadable verdict fails it"
check = "CI"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule.reminder]]
trigger = "second-maintainer"
note = "Before a second maintainer joins, an ADR sets their part in review and approval; the workflow adopted no per-change human review (DR-0001 row 4)."

[[rule]]
id = "CI-04"
level = "MUST"
statement = "Tier 1 platforms build and test on every pull request; Tier 2 platforms build nightly."
rationale = "A platform that isn't built on every PR breaks silently."
verification = "Platform matrix job"
check = "CI"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-05"
level = "MUST"
statement = "CI workflows come from one source, the conventions in the monorepo, which runs them directly. A repository outside the monorepo takes them at a pinned conventions version, and a drift check fails when its copy differs from that version."
rationale = "Hand-copied workflows drift; one pinned source keeps every project's checks the same."
verification = "CI: drift check in each repository outside the monorepo"
check = "CI"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-06"
level = "SHOULD"
statement = "A pull request merges automatically through a merge queue once it passes every required check (CI-02) and has any approval CI-15 requires, so the default branch is always green. A `hold` label pauses one pull request's merge until it is removed. Where the forge offers no merge queue, a pull request merges only when its branch is up to date with the default branch."
rationale = "A queue tests each change against the branch it lands on, not the branch it was opened from, and nothing waits on a person to press merge (DR-0001 row 4)."
verification = "Settings audit: auto-merge on; merge queue enabled, or up-to-date branches required"
check = "Settings"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-07"
level = "MUST"
statement = "Workflow steps reference actions by their repository and full commit SHA, with the version as a comment, and container images by digest."
rationale = "A mutable tag lets an upstream compromise replace the code a workflow runs."
verification = "Pin check in the workflow analyzer (CI-09)"
check = "CI"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-08"
level = "MUST"
statement = "Every workflow runs with the least privilege it needs: read-only or no permissions by default, writes granted per job, and checkouts never persist credentials. Where the forge lacks per-workflow permissions, the same outcome is enforced through repository settings and scoped tokens."
rationale = "A write token in a compromised step can push code or publish a release."
verification = "Workflow analyzer: permissions block; credentials not persisted"
check = "CI"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-09"
level = "MUST"
statement = "Workflows never run untrusted PR code with secrets or write tokens: no privileged-trigger checkout of the PR head. Pull-request workflows hold no secret; the AI review authenticates by workload identity federation, and reads a pull request without running the code or hooks it carries. Untrusted event data (titles, branch names, commit messages) reaches scripts only through environment variables. CI configuration is linted by a workflow analyzer (zizmor where it covers the forge's syntax)."
rationale = "A PR title interpolated into a shell line is code execution with the workflow's token, and any secret a pull-request workflow holds is one its code could leak."
verification = "zizmor or an equivalent workflow analyzer; Settings audit: the secrets pull-request workflows can read"
check = "CI"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-10"
level = "MUST"
statement = "Runners for PR or untrusted code are ephemeral and isolated in a container or VM: no host runners, no privileged containers, no host networking or Docker socket, no access to internal services. Workflows on pull requests from outside contributors need a maintainer's approval to run; those that the agent identity or the dependency-update bot (SEC-20) opens don't. Release jobs run on separate dedicated runners that never run PR code."
rationale = "A runner that survives a job, or shares a host, carries one PR's payload into the next job."
verification = "Settings audit: runner labels and isolation; approval for outside workflows"
check = "Settings"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-11"
level = "MUST"
statement = "The forge is hardened: 2FA is required for every account with write access (SEC-12), only the release bot creates release tags, the forge signs its own merges, webhooks authenticate with a secret, and admin accounts are separate from daily accounts. A self-hosted forge runs a supported release, is upgraded within 14 days of a security release, and has tested backups. Repositories stay publicly readable at stable URLs; one forge is canonical, with read-only mirrors elsewhere."
rationale = "The forge holds the source, the review record and the release tags; its compromise is everyone's."
verification = "Settings audit: forge hardening list"
check = "Settings"
trigger = "always"
who = "you"
moments = ["setup"]
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-12"
level = "MUST"
statement = "Every PR uses the PR template: the intent it implements, stated in full, or the issue it implements, and its ADR when it has one; a plain-language summary; each acceptance criterion with the tests that check it; the assumptions made, each with its class under the dilemma protocol and its reason; the demo evidence, which CI fills in, with before/after screenshots or a recording for UI changes; new dependencies, each with why it is needed and its license; docs updated or not needed; risks, compatibility impact and rollback; and the AI disclosure that GOV-03 requires. CI checks that the sections are filled in. Details: the PR template."
rationale = "A reviewer reads the description first; a filled template is the review's input and the commit's record."
verification = "PR template section check"
check = "CI"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-13"
level = "MUST"
statement = "Each PR covers one topic: refactors and cleanups never mix with behavior changes. PRs are squash-merged only, with the forge's squash message set to the PR title as subject and the PR description as body, so branch commits stay scaffolding and every commit on the default branch builds and passes CI."
rationale = "One commit per PR keeps history readable and bisectable, whatever wrote the branch commits."
verification = "Settings audit: squash merge is the only merge method, with the title-and-description message; Review checklist: single topic"
check = "Settings"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-14"
level = "SHOULD"
statement = "A merged change that breaks the default branch or a release is reverted first, then re-landed with a regression test. Its author and reviewer are notified."
rationale = "A revert restores a green branch in minutes; a forward fix under pressure adds a second bug."
verification = "Review checklist: revert PR links the regression test"
check = "Review"
trigger = "always"
who = "ai"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-15"
level = "MUST"
statement = "A CODEOWNERS file, generated from a single list of paths, makes the founder the code owner of every path whose change is a gated change, and of `docs/decisions/`. A pull request that changes such a path merges only with the founder's approval of its latest commit and a linked ADR; no other pull request needs a human approval."
rationale = "The forge enforces an owner's approval only where CODEOWNERS names one. Naming only the gated paths keeps the founder's gate narrow (DR-0001 row 5), and owning `docs/decisions/` makes merging an ADR the founder's acceptance of it."
verification = "Settings audit: code-owner review required and stale approvals dismissed; CI: a pull request that changes a code-owned path fails without a linked ADR or without the founder's approval of its latest commit"
check = "Settings"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule.reminder]]
trigger = "second-maintainer"
note = "Before a second maintainer joins, an ADR sets their part in review and approval, including which paths they own and what their approval gates."

[[rule]]
id = "CI-16"
level = "MUST"
statement = "CI and release builds use a pinned Rust toolchain (`rust-toolchain.toml`), bumped by deliberate PRs that fix new lints. Every workspace commits `Cargo.lock`, and CI, release and install instructions use `--locked`."
rationale = "A floating toolchain or lockfile means two builds of the same commit can differ."
verification = "`--locked` in workflows; toolchain file present"
check = "CI"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-17"
level = "MUST"
statement = "Each package builds and passes Clippy for every feature on its own and with no default features (`cargo hack --each-feature`) on every PR. Crates whose `publish` isn't `false` also pass `--feature-powerset --depth 2` on every PR, and other packages run it on a schedule. Crates targeting the web also get a wasm32 check on every PR."
rationale = "Feature combinations nobody builds are the ones that break downstream."
verification = "cargo-hack job; wasm32 check job"
check = "CI"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-18"
level = "MUST"
statement = "AI reviews run from a separate, clearly labeled bot identity and name the model that ran them. A blocking finding from the independent AI review (CI-03) holds the merge until the author's fix passes a new review; after three failed fix attempts, the pull request is marked blocked and listed in the digest. A question that the AI review escalates to the founder holds the merge until it is settled under REV-04."
rationale = "A labeled bot keeps the record honest about who reviewed what, and since its verdict is the second opinion, only a fix or a decision clears it."
verification = "Settings audit: bot identity labeled; CI: the merge waits for an approving verdict"
check = "Settings"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule.reminder]]
trigger = "second-maintainer"
note = "Before a second maintainer joins, an ADR sets their part in review and approval, including whether a blocking finding from the AI review still holds a merge on its own."

[[rule]]
id = "CI-19"
level = "SHOULD"
statement = "CI runs a spell checker (typos) with a project dictionary and one English variant, skipping translations; Taplo for TOML formatting; markdownlint; and freshness checks on generated feature and example indexes."
rationale = "Automated nits keep review comments about substance."
verification = "typos, Taplo, markdownlint and freshness jobs"
check = "CI"
trigger = "always"
who = "tool"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-20"
level = "SHOULD"
statement = "One account system spans the forge, forum, translation platform and plugin directory."
rationale = "One identity per contributor keeps attribution, moderation and access consistent across services."
verification = "Review checklist: a new service joins the shared account system"
check = "Review"
trigger = "one-point-oh"
who = "ai"
added = "0.1.0"
status = "active"

[[rule]]
id = "CI-21"
level = "SHOULD"
statement = "Release tags are signed (SSH or gitsign) and verified in CI before anything is built from them."
rationale = "An unsigned tag lets anyone with push access start a release build from any commit."
verification = "Tag signature verification job"
check = "CI"
trigger = "first-release"
who = "tool"
added = "0.1.0"
status = "active"
