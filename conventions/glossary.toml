# The glossary, sorted alphabetically (a leading "The" is ignored).

[[term]]
term = "ADR"
definition = "a decision record, numbered `DR-NNNN`, in `docs/decisions/` (DOC-04)."

[[term]]
term = "Agent identity"
definition = "the labeled forge identity through which the founder's agents push branches, open pull requests and issues, and comment (GOV-16, CI-10)."

[[term]]
term = "The AI review"
definition = "the independent review every change gets before it merges, by a reviewer agent with a fresh context and no write access, against the written review rubric; its verdict is a required check (CI-03)."

[[term]]
term = "AI-assisted change"
definition = "a change in which any code, text or asset was produced or substantially edited by an AI tool."

[[term]]
term = "Asset register"
definition = "the list of the organization's assets, such as domains, trademarks, signing keys, registry names, store and developer accounts, the forge organization and hosted services, with each one's holders or recovery path (LIFE-02)."

[[term]]
term = "Data manifest"
definition = "the machine-readable list of every endpoint and data flow that each app keeps (PRIV-07)."

[[term]]
term = "Decision pull request"
definition = "a pull request that holds an ADR and any change the ADR decides; the founder's approval accepts it (CI-15)."

[[term]]
term = "Demo evidence"
definition = "the output, screenshots and recordings included, that CI produces from a project's demo commands on each pull request (CI-12)."

[[term]]
term = "Deviation"
definition = "a departure from a SHOULD: one that is a class-3 decision has a deviation record with a review-by date (DOC-06), and any other is stated in its pull request as an assumption with its reason."

[[term]]
term = "The digest"
definition = "the report CI generates for the founder each day, exception-first, with a Monday rollup that lists class-2 decisions (DR-0001 row 7, DR-0007 row 6). It lists human-only steps and pull requests marked blocked (CI-18)."

[[term]]
term = "Dilemma protocol"
definition = "how the founder's agents settle open questions. Class 1 (reversible, technical): the agent decides and logs it in the pull request. Class 2 (reversible, product-shaping): the agent uses its default, listed in the digest, where the founder can override it with a new intent. Class 3 (irreversible, gated, a license, public-interface or published-format commitment, or a question a rule settles by ADR, such as a privacy review under PRIV-08): a decision pull request."

[[term]]
term = "The forge"
definition = "the service hosting the repositories, their pull requests and CI. GitHub today; the rules don't depend on it."

[[term]]
term = "Gated change"
definition = "a change to CI check definitions, convention files or license policy, or a crates.io publish. It lands or ships only once the founder approves its ADR or release summary (CI-15, REL-17). Since DR-0006 it also covers a release that ships AI-drafted user documentation, which waits for the founder's revision (GOV-14)."

[[term]]
term = "Hosted service"
definition = "any server the organization runs that holds other people's personal information."

[[term]]
term = "Human-only step"
definition = "a step only a human can take, such as answering a security report or submitting to Flathub. The digest lists it. It blocks nothing unless a rule says it does."

[[term]]
term = "Intent"
definition = "what to build and why, as a contributor states it in a local session; the agent writes it, with its acceptance criteria, and the contributor reads and approves that text before work starts; the approved intent goes into the pull request's description, disclosed as AI-written, as the record of the human's creative input (CI-12, GOV-03, GOV-14)."

[[term]]
term = "Maintainer"
definition = "a person named in GOVERNANCE.md with merge rights on a project."

[[term]]
term = "Model-generated media"
definition = "images, audio, video or other assets output by a generative model, including coordinates or samples a model writes directly (GOV-22, GOV-25)."

[[term]]
term = "The organization"
definition = "Kreqo, today a project run by its founder, later the non-profit (BIZ-10)."

[[term]]
term = "The organization's servers"
definition = "servers run by or for the organization, as opposed to a server the user chose or hosts."

[[term]]
term = "Outside contributions"
definition = "issues, discussions or pull requests from anyone who isn't a maintainer, other than those from the agent identity or the dependency-update bot (SEC-20). The project opens to them deliberately, and the rules marked for that trigger apply before it does."

[[term]]
term = "Procedural media"
definition = "assets produced by a reviewable algorithm whose parameters are in the repository, whoever wrote the code (GOV-26)."

[[term]]
term = "Public interface"
definition = "anything a third party can depend on: crate APIs, CLI flags, file formats, the sync protocol, the plugin API."

[[term]]
term = "Release summary"
definition = "the description of a release pull request (REL-05), which the founder's agents write (GOV-14) and the founder approves before each crates.io publish (REL-17)."

[[term]]
term = "RFC"
definition = "a public proposal following the RFC process (GOV-01)."

[[term]]
term = "Risk-tier paths"
definition = "the paths listed in a project's `project.toml` whose changes the AI review reads line by line (GOV-02): `unsafe` code, cryptography, data formats and migrations, sync, security-sensitive code, the plugin boundary, and the public API of shared crates."

[[term]]
term = "Significant change"
definition = "a new app, a new public interface, a new dependency on a C library, a license change, a change to this document, or anything a maintainer asks to see as an RFC."

[[term]]
term = "Squash commit"
definition = "the single commit a pull request lands as on the default branch, with the pull request's title as its subject and its description as its body (CI-13)."

[[term]]
term = "The suite"
definition = "every app and shared crate the organization publishes."

[[term]]
term = "The template"
definition = "the project templates and shared files in the repository that holds these conventions. Each new project starts from a template, and every project takes this document, the CI workflows, the checklists and the lint configuration from that one source, never from a hand-kept copy (CI-05)."

[[term]]
term = "Tier 1"
definition = "a platform tested in CI that blocks releases (PLAT-01)."

[[term]]
term = "User content"
definition = "anything the user creates or imports, such as notes, cards, recordings, files and settings, and the metadata around them."
