# Gating trial T13: runs on another event, and from another workflow file,
# try the AI review's login.
name: Federation probe
on:
  push:
    branches: [trial/fed-probe]
  pull_request:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          github_token: ${{ github.token }}
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          prompt: Reply with the word OK.
          claude_args: --model claude-opus-5-5 --max-turns 1 --tools Read
